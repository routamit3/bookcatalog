# Application Name
spring.application.name=Book Catalog Application

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database Configuration (Development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging Configuration
logging.level.root=INFO
logging.level.com.bookcatalog=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG

# Weather API Configuration (OpenWeatherMap)
# Sign up at https://openweathermap.org/api for a free API key
weather.api.key=demo
weather.api.url=https://api.openweathermap.org/data/2.5/weather

# Session Configuration
server.servlet.session.timeout=30m
spring.session.store-type=none

# Security
spring.security.filter.order=5
