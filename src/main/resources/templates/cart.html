<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
        }
        
        .navbar {
            background-color: var(--primary-color);
        }
        
        .cart-item-row {
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }
        
        .cart-summary {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 5px;
            position: sticky;
            top: 20px;
        }
        
        .btn-primary {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-primary:hover {
            background-color: #c0392b;
            border-color: #c0392b;
        }
        
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> BookCatalog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Browse Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alerts -->
    <div class="container mt-3">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container my-5">
        <h1 class="mb-4"><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>

        <div class="row">
            <!-- Cart Items -->
            <div class="col-lg-8">
                <div th:if="${cartItems.isEmpty()}" class="alert alert-info text-center">
                    <i class="fas fa-inbox"></i> Your cart is empty. 
                    <a href="/books">Continue shopping</a>
                </div>

                <div th:unless="${cartItems.isEmpty()}">
                    <div th:each="item : ${cartItems}" class="cart-item-row">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <h6 th:text="${item.bookTitle}"></h6>
                                <small class="text-muted" th:text="${item.bookAuthor}"></small>
                            </div>
                            <div class="col-md-2 text-end">
                                <span th:text="'$' + ${item.bookPrice}"></span>
                            </div>
                            <div class="col-md-3">
                                <form th:action="@{/cart/update}" method="post" class="d-flex">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm" style="width: 60px;">
                                    <button type="submit" class="btn btn-sm btn-outline-primary ms-2">Update</button>
                                </form>
                            </div>
                            <div class="col-md-2 text-end">
                                <strong th:text="'$' + ${item.totalPrice}"></strong>
                            </div>
                            <div class="col-md-2 text-end">
                                <form th:action="@{/cart/remove}" method="post" style="display: inline;">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="fas fa-trash"></i> Remove
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="col-lg-4">
                <div class="cart-summary">
                    <h5 class="mb-3"><i class="fas fa-receipt"></i> Order Summary</h5>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Items in cart:</span>
                            <strong th:text="${itemCount}"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <strong th:text="'$' + ${totalPrice}"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Tax (10%):</span>
                            <strong th:text="'$' + ${#numbers.formatDecimal(totalPrice * 0.1, 1, 2)}"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3 fs-5">
                            <span><strong>Total:</strong></span>
                            <strong th:text="'$' + ${#numbers.formatDecimal(totalPrice * 1.1, 1, 2)}"></strong>
                        </div>
                    </div>

                    <form th:action="@{/cart/checkout}" method="get">
                        <button type="submit" class="btn btn-primary w-100 btn-lg mb-2" th:disabled="${cartItems.isEmpty()}">
                            <i class="fas fa-credit-card"></i> Proceed to Checkout
                        </button>
                    </form>

                    <a href="/books" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>

                    <form th:action="@{/cart/clear}" method="get" class="mt-2">
                        <button type="submit" class="btn btn-outline-danger w-100" th:disabled="${cartItems.isEmpty()}">
                            <i class="fas fa-times"></i> Clear Cart
                        </button>
                    </form>
                </div>

                <!-- Weather Widget -->
                <div th:if="${weather}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem; border-radius: 5px; margin-top: 2rem;">
                    <h5><i class="fas fa-cloud"></i> Weather</h5>
                    <p class="mb-1"><strong th:text="${weather.temperature} + '°C'"></strong></p>
                    <small th:text="${weather.city}"></small>
                    <p class="mb-0 mt-2 small" th:text="${weather.description}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-white">
        <div class="container">
            <p>&copy; 2024 BookCatalog. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
