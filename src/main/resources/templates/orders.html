<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
        }
        
        .navbar {
            background-color: var(--primary-color);
        }
        
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> BookCatalog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Browse Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cart">Cart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <h1 class="mb-4"><i class="fas fa-history"></i> My Orders</h1>

        <div th:if="${orders.isEmpty()}" class="alert alert-info text-center">
            <i class="fas fa-inbox"></i> You haven't placed any orders yet.
            <a href="/books">Start shopping now</a>
        </div>

        <div th:unless="${orders.isEmpty()}">
            <div th:each="order : ${orders}" class="card mb-3">
                <div class="card-header">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <strong>Order ID:</strong> <span th:text="${order.id}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>Date:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>Status:</strong> 
                            <span class="badge" th:classappend="${order.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-warning'" 
                                  th:text="${order.status}"></span>
                        </div>
                        <div class="col-md-3 text-end">
                            <strong>Total:</strong> <span class="text-primary" th:text="'$' + ${order.totalAmount}"></span>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <h6>Items Ordered:</h6>
                    <p th:text="${order.orderItems}"></p>
                </div>
            </div>
        </div>

        <a href="/books" class="btn btn-primary mt-3">
            <i class="fas fa-shopping-cart"></i> Continue Shopping
        </a>
    </div>

    <!-- Footer -->
    <footer class="text-center text-white">
        <div class="container">
            <p>&copy; 2024 BookCatalog. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
