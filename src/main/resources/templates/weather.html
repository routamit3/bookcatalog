<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather VM | BookCatalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark" style="background:#2c3e50">
        <div class="container">
            <a class="navbar-brand" href="/">BookCatalog</a>
            <a class="nav-link text-white" href="/books">Browse Books</a>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2"><i class="fas fa-cloud-sun"></i> Weather VM</h1>
        <p class="text-muted">Enter the private IP address of the Linux weather VM.</p>

        <form action="/weather" method="get" class="row g-2 mb-4">
            <div class="col-md-6">
                <label for="weatherIp" class="form-label">Linux weather VM private IP</label>
                <input id="weatherIp" name="weatherIp" class="form-control"
                       placeholder="Example: 10.0.1.4" th:value="${weatherIp}" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" type="submit">
                    <i class="fas fa-plug"></i> Connect
                </button>
            </div>
        </form>

        <div class="card shadow-sm">
            <div class="card-body">
                <p class="text-muted mb-1">Weather response from</p>
                <h2 th:text="${weather.city}">New York</h2>
                <div class="display-5 fw-bold" th:text="${weather.temperature} + '°C'">20°C</div>
                <p class="lead" th:text="${weather.description}">Weather data</p>
                <div class="row border-top pt-3">
                    <div class="col-md-3">Humidity: <strong th:text="${weather.humidity} + '%'">0%</strong></div>
                    <div class="col-md-3">Wind: <strong th:text="${weather.windSpeed} + ' m/s'">0 m/s</strong></div>
                    <div class="col-md-3">Coat: <strong th:text="${weather.coatAdvice}">Unavailable</strong></div>
                    <div class="col-md-3">Umbrella: <strong th:text="${weather.umbrellaAdvice}">Unavailable</strong></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
