<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
        }
        
        .navbar {
            background-color: var(--primary-color);
        }
        
        .book-cover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 5rem;
            border-radius: 10px;
        }
        
        .book-info {
            padding: 2rem;
        }
        
        .btn-primary {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-primary:hover {
            background-color: #c0392b;
            border-color: #c0392b;
        }
        
        .book-title {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .book-price {
            font-size: 2rem;
            color: var(--secondary-color);
            font-weight: bold;
            margin: 1rem 0;
        }
        
        .stock-info {
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        
        .out-of-stock {
            color: var(--secondary-color);
            font-weight: bold;
        }
        
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> BookCatalog
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Browse Books</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alerts -->
    <div class="container mt-3">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container my-5">
        <a href="/books" class="text-decoration-none mb-3">
            <i class="fas fa-arrow-left"></i> Back to Books
        </a>

        <div th:if="${book}" class="row">
            <div class="col-md-5">
                <div class="book-cover">
                    <i class="fas fa-book"></i>
                </div>
            </div>

            <div class="col-md-7">
                <div class="book-info">
                    <div class="badge bg-info mb-2" th:text="${book.category}"></div>
                    
                    <h1 class="book-title" th:text="${book.title}"></h1>
                    
                    <h5 class="text-muted mb-3" th:text="${book.author}"></h5>
                    
                    <div class="book-price" th:text="'$' + ${book.price}"></div>

                    <div class="stock-info">
                        <p th:if="${book.outOfStock}" class="out-of-stock mb-0">
                            <i class="fas fa-exclamation-triangle"></i> OUT OF STOCK
                        </p>
                        <p th:unless="${book.outOfStock}" class="mb-0">
                            <i class="fas fa-check-circle" style="color: green;"></i> 
                            <span th:text="'In Stock (' + ${book.inventory} + ' available)'"></span>
                        </p>
                    </div>

                    <div class="mb-4">
                        <h5>Description</h5>
                        <p th:text="${book.description}"></p>
                    </div>

                    <div class="mb-4">
                        <h5>Book Details</h5>
                        <table class="table table-sm">
                            <tr>
                                <td><strong>ISBN:</strong></td>
                                <td th:text="${book.isbn}"></td>
                            </tr>
                            <tr>
                                <td><strong>Category:</strong></td>
                                <td th:text="${book.category}"></td>
                            </tr>
                            <tr>
                                <td><strong>Availability:</strong></td>
                                <td th:if="${book.outOfStock}" class="out-of-stock">Out of Stock</td>
                                <td th:unless="${book.outOfStock}" style="color: green;">
                                    <span th:text="${book.inventory} + ' copies available'"></span>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <!-- Add to Cart Form -->
                    <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post" class="mb-4">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity:</label>
                            <input type="number" class="form-control" style="width: 100px;" 
                                   id="quantity" name="quantity" value="1" min="1" 
                                   th:max="${book.inventory}" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100" 
                                th:disabled="${book.outOfStock}">
                            <i class="fas fa-shopping-cart"></i> Add to Cart
                        </button>
                    </form>

                    <!-- Login Link for Anonymous Users -->
                    <div sec:authorize="isAnonymous()">
                        <p class="alert alert-info">
                            <i class="fas fa-info-circle"></i> 
                            <a href="/login">Login</a> to add items to your cart
                        </p>
                    </div>

                    <a href="/books" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </div>
        </div>

        <!-- Weather Widget -->
        <div class="row mt-5" th:if="${weather}">
            <div class="col-md-6">
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 10px;">
                    <h5><i class="fas fa-cloud"></i> Current Weather</h5>
                    <p class="mb-1"><strong th:text="${weather.temperature} + '°C'"></strong></p>
                    <p class="mb-1" th:text="${weather.city}"></p>
                    <p class="mb-1" th:text="${weather.description}"></p>
                    <p class="mb-0"><i class="fas fa-wind"></i> Wind: <span th:text="${weather.windSpeed} + ' m/s'"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-white">
        <div class="container">
            <p>&copy; 2024 BookCatalog. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
